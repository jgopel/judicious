[project]
name = "judicious"
version = "0.1.0"
description = "Judicious rate limiter implemenation in Rust."
readme = "README.md"
authors = [ { name = "Jonathan Gopel", email = "jgopel@gmail.com" } ]
requires-python = ">=3.14"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.14",
]
dependencies = []

[dependency-groups]
dev = [
  "requests",
  "ruff",
  "toml",
  "ty",
]

[tool.ruff]
line-length = 88
lint.select = [ "ALL" ]
lint.ignore = [
  "D103",
  "D203",
  "D212",
  "E501",
]

[tool.ty]
rules.all = "error"
terminal.error-on-warning = true
