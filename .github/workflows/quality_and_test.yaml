name: Quality and tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  RUST_BACKTRACE: 1

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Build
        run: nix develop -c cargo build --all-targets --all-features
      - name: Run tests
        run: nix develop -c cargo test --all-targets --all-features

  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main

      - run: nix flake check --no-update-lock-file
      - run: nix develop -c uv sync --locked

      - run: nix develop -c just quality
      - run: nix develop -c just check-all-features

      - run: nix develop -c just udeps
