name: Update dependencies

on:
  schedule:
    - cron: 0 4 * * 5
      timezone: "America/Denver"
  workflow_dispatch:

jobs:
  update-dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v6
      - name: Store current date
        id: date
        run: echo "date=$(date +'%Y-%m-%d_%H-%M-%S')" >> "$GITHUB_OUTPUT"

      # Nix
      - uses: DeterminateSystems/nix-installer-action@v22
      - uses: DeterminateSystems/magic-nix-cache-action@v13
      - run: nix flake update

      # Python
      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Cache pre-commit environment
        uses: actions/cache@v5
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-3|${{ env.pythonLocation }}|${{ hashFiles('.pre-commit-config.yaml') }}

      # Python
      - run: uv lock --upgrade
      - run: uv run pre-commit autoupdate

      # Rust
      - run: uv run scripts/update_rust_toolchain.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - run: nix develop --ignore-env --command cargo upgrade  --incompatible  --recursive
      - run: nix develop --ignore-env --command cargo update

      - uses: peter-evans/create-pull-request@v8
        with:
          commit-message: ':arrow_up: Update dependencies'
          title: ':arrow_up: Update dependencies'
          branch: update-dependencies-${{ steps.date.outputs.date }}
          base: main
          labels: feature
