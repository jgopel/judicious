name: Update dependencies

on:
  schedule:
    - cron: 0 4 * * 5
      timezone: "America/Denver"
  workflow_dispatch:

jobs:
  update-dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v6
      - name: Store current date
        id: date
        run: echo "date=$(date +'%Y-%m-%d_%H-%M-%S')" >> "$GITHUB_OUTPUT"

      # Nix
      - uses: DeterminateSystems/nix-installer-action@v22
      - uses: DeterminateSystems/magic-nix-cache-action@v13

      - name: Build pre-update closure
        id: old-closure
        run: |
          set -euo pipefail
          path=$(nix build --no-link --print-out-paths \
            '.#devShells.x86_64-linux.default')
          echo "path=${path}" >> "${GITHUB_OUTPUT}"

      - name: Update flake inputs
        id: flake-update
        run: |
          set -euo pipefail
          nix flake update 2> "${{ runner.temp }}/flake-update.log"
          {
            echo 'log<<__EOF__'
            sed -E 's/\x1b\[[0-9;]*m//g' "${{ runner.temp }}/flake-update.log"
            echo '__EOF__'
          } >> "${GITHUB_OUTPUT}"

      - name: Build post-update closure
        id: new-closure
        run: |
          set -euo pipefail
          path=$(nix build --no-link --print-out-paths \
            '.#devShells.x86_64-linux.default')
          echo "path=${path}" >> "${GITHUB_OUTPUT}"

      - name: Diff closures
        id: closure-diff
        run: |
          set -euo pipefail
          nix store diff-closures \
            '${{ steps.old-closure.outputs.path }}' \
            '${{ steps.new-closure.outputs.path }}' \
            > "${{ runner.temp }}/closure-diff.log"
          {
            echo 'diff<<__EOF__'
            sed -E 's/\x1b\[[0-9;]*m//g' "${{ runner.temp }}/closure-diff.log"
            echo '__EOF__'
          } >> "${GITHUB_OUTPUT}"

      - name: Cache pre-commit environment
        uses: actions/cache@v5
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-4|${{ runner.os }}|${{ hashFiles('flake.lock', '.pre-commit-config.yaml') }}

      # pre-commit
      - run: nix develop --ignore-env --command prek autoupdate

      # Rust
      - run: |
          nix develop --ignore-env --keep-env-var GITHUB_TOKEN \
            --command just update-rust-toolchain
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - run: nix develop --ignore-env --command cargo upgrade  --incompatible  --recursive
      - run: nix develop --ignore-env --command cargo update

      - uses: peter-evans/create-pull-request@v8
        with:
          commit-message: ':arrow_up: Update dependencies'
          title: ':arrow_up: Update dependencies'
          body: |
            Automated dependency update.

            ## Nix input changes

            ```
            ${{ steps.flake-update.outputs.log }}
            ```

            ## Nix package changes in `devShells.x86_64-linux.default`

            ```
            ${{ steps.closure-diff.outputs.diff }}
            ```
          branch: update-dependencies-${{ steps.date.outputs.date }}
          base: main
          labels: feature
